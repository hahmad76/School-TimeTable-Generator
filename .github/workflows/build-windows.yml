name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Extract Build 0.6 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source | Out-Null
          $b64 = (Get-Content "Build_0_6_Source.part1" -Raw) + (Get-Content "Build_0_6_Source.part2" -Raw)
          $zipBytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("Build_0_6_Source.zip", $zipBytes)
          Expand-Archive -Path "Build_0_6_Source.zip" -DestinationPath "source" -Force
          # Correct JavaFX launcher configuration for Windows EXE.
          $pom = Get-Content "source/pom.xml" -Raw
          $pom = $pom -replace '<jre>\s*<path>jre</path>', '<jre><path>jre</path><opt>--module-path "%EXEDIR%\\lib"</opt><opt>--add-modules javafx.controls,javafx.fxml</opt>'
          Set-Content "source/pom.xml" $pom -Encoding UTF8

      - name: Build and test
        working-directory: source
        run: mvn -B -Pwin64 test package

      - name: Download bundled Java 11 runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/11/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile jre.zip
          Expand-Archive -Path jre.zip -DestinationPath jre-unpacked -Force
          $jre = Get-ChildItem jre-unpacked -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName "bin\java.exe") } | Select-Object -First 1
          if (-not $jre) { throw "Bundled JRE directory not found after extraction." }
          Remove-Item jre -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $jre.FullName jre -Recurse

      - name: Assemble portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/lib | Out-Null
          Copy-Item "source/target/School_TimeTable_Generator_V1_0_Build_0_6.exe" "package/School_TimeTable_Generator_V1_0_Build_0_6.exe"
          Copy-Item "source/target/school-timetable-generator-1.0.0.jar" "package/school-timetable-generator-1.0.0.jar"
          Copy-Item "source/target/lib/*" "package/lib" -Force
          Copy-Item "jre" "package/jre" -Recurse
          Copy-Item "source/README.md" "package/README.md"
          Copy-Item "source/BUILD_0_6_RELEASE_NOTE.md" "package/BUILD_0_6_RELEASE_NOTE.md"
          Compress-Archive -Path "package/*" -DestinationPath "School_TimeTable_Generator_V1_0_Build_0_6_Windows_x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: School_TimeTable_Generator_V1_0_Build_0_6_Windows_x64
          path: School_TimeTable_Generator_V1_0_Build_0_6_Windows_x64.zip
